version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - ~/.config/gcloud:/root/.config/gcloud:ro
    ports:
      - "8080:8080"
    # IMPORTANTE: Esto evita que los logs se queden en el buffer
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - APP_ENV=local
      - GIN_MODE=release # O debug
    networks:
      - ril_network
      - go_app
    depends_on:
      - redis
  mcp-toolbox:
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:latest
    user: root
    hostname: toolbox
    working_dir: /app
    ports:
      - "5003:5000"
    volumes:
      - .:/app
      - ~/.config/gcloud:/root/.config/gcloud:ro
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    command: >
      --tools-file /app/tools-dev.yaml
      --address 0.0.0.0
    networks:
      - go_app
  redis:
    image: redis:alpine
    networks:
      - go_app
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: [ "redis-server", "--save", "60", "1", "--appendonly", "yes" ]
networks:
  ril_network:
    external: true
  go_app:
    driver: bridge
volumes:
  redis-data:
    driver: local
