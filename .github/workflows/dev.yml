name: DEV Deployment Workflow
on:
  push:
    branches:
      - dev
jobs:
  build_and_deploy_gcp:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code repository
        uses: actions/checkout@v3

      - name: Auth GCP with Workload Identity Federation
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: projects/216087263834/locations/global/workloadIdentityPools/ril-ai-service-repository/providers/github
          service_account: "ril-api-api-wif@ril-admin.iam.gserviceaccount.com"

      # Configurar gcloud
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v1

      - name: Toolbox secret update
        run: |
          gcloud secrets versions add tools-dev --data-file=tools-dev.yaml --project=ril-admin

      - name: Deploy Toolbox to Cloud Run
        run: |
          gcloud run deploy toolbox-dev \
            --image us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:latest \
            --region us-central1 \
            --update-secrets /app/tools.yaml=tools-dev:latest \
            --args="--tools-file=/app/tools.yaml,--address=0.0.0.0,--port=8080"

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Build and Push Docker Image to Artifact Registry
        run: |
          IMAGE_NAME="us-docker.pkg.dev/ril-admin/ril-ai-service-repository/go-ai-app-dev:${{ github.sha }}"
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: ril-ai-service-dev
          region: us-central1
          image: us-docker.pkg.dev/ril-admin/ril-ai-service-repository/go-ai-app-dev:${{ github.sha

  notify-google:
    name: Notify-Google
    needs: build_and_deploy_gcp
    runs-on: ubuntu-latest
    steps:
      - name: Notify Google Chat
        run: |
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          BRANCH="${{ github.ref_name }}"
          STATUS="${{ job.status == 'success' && '✅ Deploy exitoso' || '❌ Falló el deploy' }}"
          PR_TITLE="${{ github.event.pull_request.title || '' }}"
          PR_URL="${{ github.event.pull_request.html_url || '' }}"
          MERGE_AUTHOR="${{ github.actor }}"
          MESSAGE="*${STATUS}*\nRepositorio: \`${{ github.repository }}\`\nBranch: \`${BRANCH}\`\nCommit: [${{ github.sha }}](${COMMIT_URL})\nMergeado por: \`${MERGE_AUTHOR}\`"
          curl -X POST \
            -H 'Content-Type: application/json' \
            -d "{\"text\": \"$MESSAGE\"}" \
            "https://chat.googleapis.com/v1/spaces/AAQAA3F9pLA/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=5oLsjWqJRo9oKPeWbxFyu0EwY4XFSmadVYosJY-4Qlo"
