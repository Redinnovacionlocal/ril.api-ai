sources:
  bigquery-source:
    kind: bigquery
    project: "ril-admin"
  postgres-db:
    kind: postgres
    host: ${DB_HOST}
    port: ${DB_PORT}
    database: ${DB_NAME}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
tools:
  get_user_data_by_id:
    kind: bigquery-sql
    source: bigquery-source
    description: "Use this tool to retrieve user data from BigQuery based on the provided user ID. The user ID should be a string that can be cast to an integer, as the underlying BigQuery table expects an integer ID."
    parameters:
      - name: user_id
        type: string
        description: "The ID of the user to retrieve data for"
    statement: |
      SELECT * FROM `ril-admin.portalrilpril2022_prod.sitio_usuarios_recomendador`  as ur
      INNER JOIN `ril-admin.portalrilpril2022_prod.sitio_conectarme_perfil` as cp
      on cp.id_usuario_recomendador = ur.id_usuario_recomendador
      WHERE ur.id_usuario_recomendador = CAST(@user_id AS INT64)
  get_certificate_by_id_team:
    kind: bigquery-sql
    source: bigquery-source
    description: "Use this tool to retrieve certificate data from BigQuery based on the provided team ID. The team ID should be a string that can be cast to an integer, as the underlying BigQuery table expects an integer ID."
    parameters:
      - name: team_id
        type: string
        description: "The ID of the team to retrieve certificate data for"
    statement: |
      SELECT
      t1.*,
      t2.nombre,
      t2.descripcion,
      FROM
      `ril-admin`.`portalrilpril2022_prod`.`sitio_certificados_obtenidos` AS t1
      INNER JOIN
      `ril-admin`.`portalrilpril2022_prod`.`sitio_certificados` as t2
      ON
      t1.id_certificado = t2.id_certificado
      WHERE t1.id_equipo = CAST(@team_id AS INT64)
      ORDER BY
      t1.created_at;
  get_all_certificates_active:
    kind: bigquery-sql
    source: bigquery-source
    description: "Use this tool to retrieve all active certificates from BigQuery. This will return a list of all certificates that are currently active, along with their details such as name and description."
    statement: |
      SELECT *, CONCAT( 'https://portalril.org/ar/certificarme/practicas?id_certificado=', cr.id_certificado) AS link_acceso_certificado
      FROM  `ril-admin.portalrilpril2022_prod.sitio_certificados` as cr
      INNER JOIN `ril-admin.portalrilpril2022_prod.sitio_certificados_tipos` as crt on crt.id_tipo = cr.id_tipo
      where cr.baja = 0 order by cr.fecha_actualizacion DESC;
  get_all_questionnare_active:
    kind: bigquery-sql
    source: bigquery-source
    description: "Use this tool to retrieve all active questionnaires from BigQuery. This will return a list of all questionnaires that are currently active, along with their details such as name and description."
    statement: |
      SELECT 
        sc.nombre AS cuestionario_nombre,
        sc.descripcion,
        sct.nombre AS tipo_nombre,
        sc.duracion,
        sc.texto_libre
      FROM `ril-admin.portalrilpril2022_prod.sitio_cuestionario` AS sc
      -- Usamos LEFT JOIN UNNEST para no perder filas si el ID está vacío
      LEFT JOIN UNNEST(SPLIT(sc.id_cuestionario_tipo, ',')) AS id_individual
      LEFT JOIN `ril-admin.portalrilpril2022_prod.sitio_cuestionario_tipo` AS sct
      -- SAFE_CAST devuelve NULL en vez de error si encuentra basura en el texto
      ON SAFE_CAST(TRIM(id_individual) AS INT64) = sct.id_cuestionario_tipo
      and sc.baja = 0
      LIMIT 1000;
  get_questionnarie_questions_by_id_or_name:
    kind: bigquery-sql
    source: bigquery-source
    description: "Use this tool to retrieve questions for a specific questionnaire from BigQuery based on the provided questionnaire ID or name. The questionnaire ID should be a string that can be cast to an integer, as the underlying BigQuery table expects an integer ID. Alternatively, you can provide the name of the questionnaire to retrieve its questions."
    parameters:
      - name: questionnaire_name
        type: string
        description: "The name of the questionnaire to retrieve questions for"
    statement: |
      SELECT * FROM `portalrilpril2022_prod.sitio_cuestionario_pregunta` as scp
      INNER JOIN `portalrilpril2022_prod.sitio_cuestionario` as sc on scp.id_cuestionario = sc.id_cuestionario
      where sc.baja = 0
      AND sc.nombre = @questionnaire_name
      order by scp.orden asc
  get_ril_aliances:
    kind: bigquery-sql
    source: bigquery-source
    description: "Tool to retrieve the list of active RIL alliances."
    statement: |
      SELECT ARRAY_AGG(STRUCT(Nombre, Fecha_de_cierre)) as alianzas
      FROM (
        SELECT
          a.Name as Nombre,
          MIN(op.CloseDate) as `Fecha_de_cierre`
        FROM `ril-admin.salesforce_raw.Opportunity` op
        INNER JOIN `ril-admin.salesforce_raw.RecordType` rt ON op.RecordTypeId = rt.Id
        INNER JOIN `salesforce_raw.Account` a ON a.Id = op.AccountId
        WHERE rt.DeveloperName != 'Alianza_con_Gobierno_Local'
          AND op.IsDeleted = false
          AND a.IsDeleted = false
          AND op.CloseDate > CURRENT_DATE()
          AND op.StageName IN ('Closed Won', 'Confirmado')
        GROUP BY a.Name
        ORDER BY SUM(op.Amount) DESC
      )
  get_ril_aliances_by_account_name:
    kind: bigquery-sql
    source: bigquery-source
    description: "Search for RIL alliances by account name. Use this when the user asks for a specific company or organization."
    parameters:
      - name: nombre_cuenta
        type: string
        description: "The name or part of the name of the account."
    statement: |
      SELECT
        a.Name as Nombre,
        MIN(op.CloseDate) as `Fecha_de_cierre`
      FROM `ril-admin.salesforce_raw.Opportunity` op
      INNER JOIN `ril-admin.salesforce_raw.RecordType` rt ON op.RecordTypeId = rt.Id
      INNER JOIN `salesforce_raw.Account` a ON a.Id = op.AccountId
      WHERE rt.DeveloperName != 'Alianza_con_Gobierno_Local'
        AND op.IsDeleted = false
        AND a.IsDeleted = false
        AND op.CloseDate > CURRENT_DATE()
        AND LOWER(a.Name) LIKE CONCAT('%', LOWER(@nombre_cuenta), '%')
        AND op.StageName IN ('Closed Won', 'Confirmado')
      GROUP BY a.Name
  get_ril_aliances_by_year:
    kind: bigquery-sql
    source: bigquery-source
    description: "List RIL alliances that close in a specific year."
    parameters:
      - name: anio_cierre
        type: string
        description: "The 4-digit year (e.g., 2025)."
    statement: |
      SELECT ARRAY_AGG(STRUCT(Nombre, Fecha_de_cierre)) as alianzas
      FROM (
        SELECT
          a.Name as Nombre,
          MIN(op.CloseDate) as `Fecha_de_cierre`
        FROM `ril-admin.salesforce_raw.Opportunity` op
        INNER JOIN `ril-admin.salesforce_raw.RecordType` rt ON op.RecordTypeId = rt.Id
        INNER JOIN `salesforce_raw.Account` a ON a.Id = op.AccountId
        WHERE rt.DeveloperName != 'Alianza_con_Gobierno_Local'
          AND op.IsDeleted = false
          AND a.IsDeleted = false
          AND EXTRACT(YEAR FROM op.CloseDate) = CAST(@anio_cierre AS INT64)
          AND op.StageName IN ('Closed Won', 'Confirmado')
        GROUP BY a.Name
        ORDER BY SUM(op.Amount) DESC
      )
  get_ril_staff:
    kind: bigquery-sql
    source: bigquery-source
    description: "Use this tool to retrieve the list of active RIL team members.
      Call this tool when the user asks who to contact, wants to reach someone from RIL,
      or when the conversation topic matches a specific area (e.g. alliances, communication,
      innovation, sustainability).
      PRESENTING RESULTS: For each person returned, always display their equipo value
      exactly as it comes from the data (e.g. Global, Argentina, Brasil, Colombia).
      Never group, infer, or generalize equipo across multiple results — each person
      must show their own individual equipo value."
    statement: |
      SELECT ARRAY_AGG(STRUCT(nombre, categoria, descripcion, email, equipo)) as team
      FROM (
        SELECT 
          e.nombre, 
          ec.nombre AS categoria,
          e.descripcion, 
          e.email,
          te.nombre AS equipo
        FROM `ril-admin.ril_webpublic.sitio_equipo` e
        INNER JOIN `ril-admin.ril_webpublic.sitio_equipo_categoria` ec
          ON e.id_equipo_categoria = ec.id_equipo_categoria
        INNER JOIN `ril-admin.ril_webpublic.sitio_tipo_equipo` te
          ON e.id_tipo_equipo = te.id 
        WHERE e.baja = FALSE
          AND e.activo = TRUE
          AND ec.baja = FALSE
          AND ec.activo = TRUE
        ORDER BY ec.orden, e.orden
      )